<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Evento</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/cadastroevento.css">
    <link rel="icon" href="/img/faviconlogo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div class="Logo">
    <img src="/img/UEMA.png" alt="LogoUEMA">
</div>
<header class="navbar">
    <nav class="menu">
        <a href="/home">Home</a>
        <a href="/cadastroevento">Eventos</a>
        <a href="/register">Contatos</a>
        <a href="/login">Login</a>
    </nav>
</header>

<div class="login-container">
    <div class="login-card">
        <div class="login-content">
            <div class="login-form">
                <h2>Criar Evento</h2>
                <form id="eventForm">
                    <label for="title">Título do Evento</label>
                    <input type="text" id="title" name="title" required>

                    <label for="image">URL da Imagem</label>
                    <input type="text" id="image" name="image" required>

                    <label for="description">Descrição</label>
                    <textarea id="description" name="description" required></textarea>

                    <label for="dataEvent">Data do Evento</label>
                    <input type="date" id="dataEvent" name="dataEvent" required>

                    <label for="localEvent">Local do Evento</label>
                    <input type="text" id="localEvent" name="localEvent" required>

                    <button type="submit" class="login-button">Criar Evento</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2024 Plataforma de Eventos. Todos os direitos reservados.</p>
        <div class="footer-links">
            <a href="">Sobre</a>
            <a href="">Contato</a>
            <a href="">Política de Privacidade</a>
            <a href="">Termos de Uso</a>
        </div>
    </div>
</footer>

<script>
    document.getElementById("eventForm").addEventListener("submit", function (event) {
        event.preventDefault(); // Previne o envio padrão do formulário

        const evento = {
            title: document.getElementById("title").value,
            image: document.getElementById("image").value,
            description: document.getElementById("description").value,
            dataEvent: document.getElementById("dataEvent").value,
            localEvent: document.getElementById("localEvent").value
        };

        fetch("/api/eventos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(evento)
        })
            .then(response => response.json())
            .then(data => {
                alert("Evento criado com sucesso!");
                window.location.href = "/home"; // Redireciona para a página inicial
            })
            .catch(error => {
                alert("Erro ao criar evento: " + error);
            });
    });
</script>

</body>
</html>
