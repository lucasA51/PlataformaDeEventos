<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="icon" href="/img/faviconlogo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div class="Logo">
    <img src="/img/UEMA.png" alt="LogoUEMA">
</div>
<header class="navbar">
    <nav class="menu">
        <a href="/home">Home</a>
        <a href="/cadastroevento">Eventos</a>
        <a href="/register">Contatos</a>
        <a href="/login">Login</a>
    </nav>
</header>

<div class="card-container">
    <th:block th:each="evento : ${eventos}">
        <div class="card">
            <img th:src="${evento.image}" alt="Imagem do Evento">
            <div class="textcard">
                <h3 th:text="${evento.title}">Nome do Evento</h3>
                <p>Data: <span th:text="${#dates.format(evento.dataEvent, 'dd/MM/yyyy')}">01/12/2024</span></p>
                <p>Local: <span th:text="${evento.localEvent}">Centro de Convenções</span></p>
                <button class="subscribe-button">Inscreva-se</button>
            </div>
        </div>
    </th:block>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2024 Plataforma de Eventos. Todos os direitos reservados.</p>
        <div class="footer-links">
            <a href="">Sobre</a>
            <a href="">Contato</a>
            <a href="">Política de Privacidade</a>
            <a href="">Termos de Uso</a>
        </div>
    </div>
</footer>
</body>

</html>
