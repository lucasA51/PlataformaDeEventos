<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/register.css">
    <link rel="icon" href="/img/faviconlogo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="Logo">
        <img src="/img/UEMA.png" alt="LogoUEMA">
    </div>
    <header class="navbar">
        <nav class="menu">
            <a href="/home">Home</a>
            <a href="/cadastroevento">Eventos</a>
            <a href="/register">Contatos</a>
            <a href="/login">Login</a>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-card">
            <div class="login-content">
                <div class="login-form">
                    <h2>Registre-se</h2>
                    <form action="#" method="post">
                        <label for="fullname">Nome Completo</label>
                        <input type="text" id="fullname" name="fullname" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <label for="username">Usuário</label>
                        <input type="text" id="username" name="username" required>

                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required>

                        <label for="confirm-password">Confirme a Senha</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>

                        <button type="submit" class="login-button">Cadastrar</button>
                        <p class="register-link">Já tem uma conta? <a href="/login">Entrar</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Plataforma de Eventos. Todos os direitos reservados.</p>
            <div class="footer-links">
                <a href="">Sobre</a>
                <a href="">Contato</a>
                <a href="">Política de Privacidade</a>
                <a href="">Termos de Uso</a>
            </div>
        </div>
    </footer>

</body>

</html>
